    <script>
      // 首帧之前应用主题，避免深色用户看到白屏闪烁（默认白天）

        if (localStorage.getItem('gallery-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
